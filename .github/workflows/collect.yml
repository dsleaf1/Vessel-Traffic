name: Collect AIS snapshot

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may start runs late)
  workflow_dispatch:
    inputs:
      seconds:
        description: "Listening window in seconds"
        default: "120"

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install websockets

      - name: Listen to aisstream
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          LISTEN_SECONDS: ${{ github.event.inputs.seconds || '120' }}
        run: python collector/collect.py --seconds "$LISTEN_SECONDS"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data"; exit 0
          fi
          git commit -m "AIS snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          echo "Push failed after 3 tries"; exit 1
